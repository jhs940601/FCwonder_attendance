*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{

  color:var(--ink);

  overflow-x:hidden;
}

.wrap{max-width:900px; margin:0 auto; padding:0 16px 60px;}

@media (max-width:600px){
  header.hero{ padding:108px 16px 26px; }
  header.hero::after{ width:195px; height:115px; top:12px; }
}
.hero-inner{
  max-width:900px;
  margin:0 auto;
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.crest{
  width:76px; height:76px;
  border-radius:20px;
  background:#fff;
  padding:6px;
  box-shadow: var(--shadow);
  flex-shrink:0;
}
.crest img{width:100%; height:100%; object-fit:contain; display:block;}
.hero-text h1{
  margin:0;
  font-size:22px;
  font-weight:800;
  color:#fff;
  letter-spacing:-0.3px;
}
.hero-text p{
  margin:4px 0 0;
  font-size:13px;
  color:#b9c0d6;
  font-weight:500;
}
.mode-toggle{
  margin-left:auto;
  display:flex;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:999px;
  padding:4px;
  gap:2px;
  width:100%;
  max-width:460px;
}
.mode-toggle button{
  border:none;
  background:transparent;
  color:#c7cde2;
  font-family:inherit;
  font-weight:700;
  font-size:12px;
  padding:9px 6px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
  flex:1;
}
.mode-toggle button.active{
  background:var(--orange);
  color:#fff;
  box-shadow:0 4px 12px -2px rgba(242,76,39,0.6);
}
.admin-corner-btn{
  position:absolute;
  top:14px; right:16px;
  z-index:3;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  color:#dfe3ee;
  font-family:inherit;
  font-weight:700;
  font-size:11.5px;
  padding:7px 12px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
}
.admin-corner-btn:hover{ background:rgba(255,255,255,0.18); color:#fff; }
.admin-corner-btn.active-admin{ background:var(--orange); border-color:var(--orange); color:#fff; }

/* ---------- DEADLINE BANNER ---------- */
.deadline-banner{
  max-width:900px;
  margin:-22px auto 0;
  position:relative;
  z-index:2;
  padding:0 16px;
}
.deadline-card{
  background:#fff;
  border-radius:14px;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:var(--shadow);
  border-left:5px solid var(--orange);
}
.deadline-card .icon-badge{
  width:34px; height:34px; border-radius:10px;
  background:var(--orange-dim);
  color:var(--orange);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
.deadline-card .txt{
  font-size:13.5px; font-weight:700; color:var(--navy); line-height:1.5;
  white-space:nowrap;
}
.deadline-card .txt .hl{
  background-image:linear-gradient(180deg, transparent 62%, var(--orange-dim) 62%);
  color:var(--orange);
  font-weight:900;
  padding:0 2px;
}
@media (max-width:420px){
  .deadline-card{ padding:12px 12px; gap:9px; }
  .deadline-card .icon-badge{ width:28px; height:28px; font-size:14px; border-radius:8px; }
  .deadline-card .txt{ font-size:11.5px; }
}
.deadline-card.special-alert{
  margin-top:8px;
  cursor:pointer;
  background:var(--orange-dim);
  border-left-color:var(--orange);
}
.deadline-card.special-alert .icon-badge.special{ background:#fff; }
.deadline-card.special-alert .txt{
  color:var(--orange); white-space:normal; flex:1; font-weight:800;
}
.deadline-card.special-alert .arrow{ color:var(--orange); font-weight:900; font-size:16px; flex-shrink:0; }
.deadline-card.special-alert:hover{ filter:brightness(0.97); }
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,0.6);}
  70%{box-shadow:0 0 0 9px rgba(255,255,255,0);}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
}

/* ---------- GENERIC ---------- */
.section-title{
  font-size:15px;
  font-weight:800;
  color:var(--navy);
  margin:0 0 12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.step-num{
  width:22px;height:22px;
  border-radius:7px;
  background:var(--navy);
  color:#fff;
  font-size:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  margin-top:16px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.muted{color:var(--ink-soft); font-size:12.5px; line-height:1.6;}
label.muted{ display:block; margin:12px 0 2px; font-weight:700; }

/* ---------- DATE PICKER ---------- */
.month-group{margin-bottom:14px;}
.month-label{
  font-size:12px; font-weight:800; color:var(--orange);
  margin:0 0 8px 2px; text-transform:uppercase; letter-spacing:.5px;
}
.date-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(84px,1fr));
  gap:8px;
}
.date-chip{
  border:1.5px solid var(--line);
  background:#fafbfd;
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  cursor:pointer;
  font-family:inherit;
  transition:.15s;
  position:relative;
}
.date-chip:hover{border-color:var(--orange-light);}
.date-chip .d-month{font-size:10.5px; color:var(--ink-soft); font-weight:700;}
.date-chip .d-day{font-size:17px; font-weight:800; color:var(--navy); margin-top:1px;}
.date-chip.selected{
  background:var(--navy); border-color:var(--navy);
}
.date-chip.selected .d-month{color:#aab3cc;}
.date-chip.selected .d-day{color:#fff;}
.date-chip.next-badge::before{
  content:"이번주";
  position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  background:var(--orange); color:#fff; font-size:9px; font-weight:800;
  padding:2px 6px; border-radius:6px; white-space:nowrap;
}

/* ---------- DEPT / NAME GRID ---------- */
.dept-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.dept-btn{
  border:1.5px solid var(--line);
  background:#fafbfd;
  border-radius:14px;
  padding:16px 10px;
  text-align:center;
  cursor:pointer;
  font-family:inherit;
  font-weight:800;
  font-size:14.5px;
  color:var(--navy);
  transition:.15s;
}
.dept-btn:hover{border-color:var(--orange-light);}
.dept-btn.selected{background:var(--navy); border-color:var(--navy); color:#fff;}
.dept-btn .cnt{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:3px;}
.dept-btn.selected .cnt{color:#aab3cc;}

.name-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;}
.name-btn{
  border:1.5px solid var(--line);
  background:#fafbfd;
  border-radius:12px;
  padding:12px 6px;
  text-align:center;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
  font-size:13.5px;
  color:var(--ink);
  transition:.15s;
  position:relative;
}
.name-btn:hover{border-color:var(--orange-light);}
.name-btn.selected{background:var(--orange); border-color:var(--orange); color:#fff;}
.name-btn .badge{
  position:absolute; top:-6px; right:-6px;
  width:16px; height:16px; border-radius:50%;
  font-size:10px; display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#fff;
}
.name-btn .badge.present{background:var(--green);}
.name-btn .badge.absent{background:var(--red);}

/* ---------- STATUS BUTTONS ---------- */
.status-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.status-btn{
  border:2px solid var(--line);
  background:#fafbfd;
  border-radius:16px;
  padding:26px 10px;
  text-align:center;
  cursor:pointer;
  font-family:inherit;
  transition:.15s;
}
.status-btn .emoji{font-size:30px; display:block; margin-bottom:6px;}
.status-btn .label{font-weight:800; font-size:15px;}
.status-btn.present{color:var(--green);}
.status-btn.present:hover, .status-btn.present.selected{background:var(--green-dim); border-color:var(--green);}
.status-btn.absent{color:var(--red);}
.status-btn.absent:hover, .status-btn.absent.selected{background:var(--red-dim); border-color:var(--red);}

.breadcrumb{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-top:14px;
}
.breadcrumb b{color:var(--navy);}
.breadcrumb .chip{
  background:var(--orange-dim); color:var(--orange); padding:3px 9px; border-radius:999px; font-weight:800;
}
.reset-link{
  margin-left:auto; color:var(--orange); cursor:pointer; font-weight:800; text-decoration:underline;
  font-size:12px;
}

.submit-btn{
  width:100%; margin-top:18px;
  background:var(--navy); color:#fff; border:none; border-radius:14px;
  padding:15px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;
  transition:.15s;
}
.submit-btn:hover{background:var(--navy-700);}
.submit-btn:disabled{background:#c6cad6; cursor:not-allowed;}

.notice-box{
  margin-top:16px; background:#fff9f5; border:1px dashed var(--orange-light);
  border-radius:12px; padding:12px 14px; font-size:12.5px; color:#8a4426; line-height:1.7; font-weight:600;
}
@media (max-width:380px){
  .notice-box{ font-size:11px; padding:11px 12px; }
}

.confirm-card{
  text-align:center; padding:34px 20px;
}
.confirm-card .icon{font-size:44px;}
.confirm-card h3{margin:10px 0 4px; font-size:18px; color:var(--navy);}
.confirm-card p{margin:0; color:var(--ink-soft); font-size:13px;}
.confirm-card .again-btn{
  margin-top:18px; background:none; border:1.5px solid var(--navy); color:var(--navy);
  padding:10px 18px; border-radius:999px; font-weight:800; cursor:pointer; font-family:inherit; font-size:13px;
}

/* ---------- TABS (admin) ---------- */
.admin-tabs{display:flex; gap:8px; margin-top:18px;}
.admin-tabs button{
  flex:1; border:none; background:#e9ebf3; color:var(--ink-soft);
  padding:12px; border-radius:12px; font-weight:800; font-size:13px; cursor:pointer; font-family:inherit;
  transition:.15s;
}
.admin-tabs button.active{background:var(--navy); color:#fff;}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-top:14px;}
.stat-box{
  background:#fafbfd; border:1px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center;
}
.stat-box .num{font-size:21px; font-weight:800; color:var(--navy);}
.stat-box .lb{font-size:11px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
.stat-box.hl .num{color:var(--orange);}

table.data-table{width:100%; border-collapse:collapse; margin-top:14px; font-size:13px;}
table.data-table th{
  text-align:left; font-size:11px; color:var(--ink-soft); text-transform:uppercase;
  letter-spacing:.4px; padding:8px 8px; border-bottom:2px solid var(--line);
}
table.data-table td{padding:10px 8px; border-bottom:1px solid var(--line); font-weight:600;}
table.data-table tr:last-child td{border-bottom:none;}
.status-pill{
  display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px;
  font-size:11.5px; font-weight:800;
}
.status-pill.present{background:var(--green-dim); color:var(--green);}
.status-pill.absent{background:var(--red-dim); color:var(--red);}
.status-pill.none{background:#eef0f5; color:#9aa0b4;}

.dept-tag{
  display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:800;
  background:var(--navy); color:#fff;
}
.rank-badge{font-weight:800;}
.rank-1{color:var(--gold);}
.rank-2{color:#8b95a8;}
.rank-3{color:#b06a35;}

select.date-select, select.form-select{
  width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
  font-family:inherit; font-weight:700; font-size:14px; color:var(--navy); background:#fafbfd; margin-top:10px;
}

.gate{
  text-align:center; padding:40px 20px;
}
.gate input{
  width:100%; max-width:240px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
  font-family:inherit; font-weight:700; font-size:15px; text-align:center; margin-top:16px; letter-spacing:2px;
}
.gate button{
  display:block; margin:14px auto 0; background:var(--navy); color:#fff; border:none;
  padding:11px 26px; border-radius:999px; font-weight:800; cursor:pointer; font-family:inherit;
}
.gate .err{color:var(--red); font-size:12px; font-weight:700; margin-top:8px; min-height:16px;}

.legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.legend span{
  background:#fafbfd; border:1px solid var(--line); border-radius:999px;
  padding:5px 12px; font-size:11.5px; font-weight:700; color:var(--ink-soft);
}

.sheet-wrap{overflow-x:auto; margin-top:14px; border:1px solid var(--line); border-radius:12px;}
table.sheet-table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:12.5px;}
.sheet-table th, .sheet-table td{padding:8px 10px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap;}
.sheet-table thead th{background:var(--navy); color:#fff; font-weight:800; font-size:11.5px; position:sticky; top:0;}
.sheet-table .sticky-col{position:sticky; left:0; background:#fff; text-align:left; font-weight:800; color:var(--navy); border-right:1px solid var(--line); z-index:1;}
.sheet-table thead .sticky-col{background:var(--navy); color:#fff; z-index:2;}
.sheet-table tbody tr:nth-child(even) td{background:#fafbfd;}
.sheet-table tbody tr:nth-child(even) td.sticky-col{background:#fafbfd;}
.sheet-table tfoot td{background:#eef0f5; font-weight:800; color:var(--navy); border-bottom:none;}
.sheet-table tfoot td.sticky-col{background:#eef0f5;}
.sheet-table .c-present{color:var(--green); font-weight:900;}
.sheet-table .c-absent{color:var(--red); font-weight:900;}
.sheet-table .c-none{color:#c0c5d3;}
.sheet-table .rate{color:var(--orange); font-weight:900;}
.spinner-row{text-align:center; padding:30px; color:var(--ink-soft); font-weight:700; font-size:13px;}

.footer-note{text-align:center; margin-top:30px; font-size:11.5px; color:#9aa0b4; line-height:1.8;}

@media (max-width:480px){
  .hero-inner{gap:12px;}
  .crest{width:60px; height:60px;}
  .hero-text h1{font-size:18px;}
  .mode-toggle{width:100%; margin-left:0; justify-content:center;}
  .status-grid{grid-template-columns:1fr;}
  .dept-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

/* ================= DATE HELPERS ================= */
function pad(n){ return n < 10 ? "0"+n : ""+n; }
function isoOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const WEEKDAY_KR = ['일','월','화','수','목','금','토'];
function weekdayOf(d){ return WEEKDAY_KR[d.getDay()]; }
function labelOf(d){ return `${d.getMonth()+1}월 ${d.getDate()}일 (${weekdayOf(d)})`; }
function monthKeyOf(d){ return `${d.getFullYear()}년 ${d.getMonth()+1}월`; }
function fullDateLabel(d){ return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${weekdayOf(d)})`; }

function getThursdays(){
  const start = new Date(2026,7,20); // 2026-08-20 (시즌 시작일)
  const end = new Date(2026,11,31);  // 2026-12-31
  const arr = [];
  let cur = new Date(start);
  while(cur <= end){
    arr.push(new Date(cur));
    cur.setDate(cur.getDate()+7);
  }
  return arr;
}
const SEASON_DATES = getThursdays();
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
function findNextThursdayISO(){
  for(const d of SEASON_DATES){ if(d >= TODAY) return isoOf(d); }
  return isoOf(SEASON_DATES[0]);
}

  try{
    const { data, error } = await sb.from('attendance')
      .select('member_name,department,status,updated_at')
      .eq('training_date', iso);
    if(error) throw error;

}

async function getAllSeasonRecords(){
  const out = {};
  SEASON_DATES.forEach(d => out[isoOf(d)] = {});
  try{
    const startIso = isoOf(SEASON_DATES[0]);
    const endIso = isoOf(SEASON_DATES[SEASON_DATES.length-1]);
    const { data, error } = await sb.from('attendance')
      .select('training_date,member_name,department,status')
      .gte('training_date', startIso).lte('training_date', endIso);
    if(error) throw error;
    (data||[]).forEach(row => {
      const iso = row.training_date;
      if(!out[iso]) out[iso] = {};
      out[iso][row.member_name] = { dept: row.department, status: row.status };
    });
  }catch(e){ console.error('시즌 데이터 불러오기 실패', e); }
  return out;
}

/* ================= REALTIME ================= */
function initRealtime(){
  sb.channel('attendance-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, () => {
      handleRealtimeChange();
    })
    .subscribe();
  sb.channel('special-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'special_events' }, () => {
      checkSpecialAlert();
      if(state.mode === 'special') renderSpecialTab();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'special_attendance' }, () => {
      if(state.mode === 'special') renderSpecialTab();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'special_polls' }, () => {
      if(state.mode === 'special') renderSpecialTab();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'special_poll_votes' }, () => {
      if(state.mode === 'special') renderSpecialTab();
    })
    .subscribe();
  sb.channel('settings-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, async () => {
      await loadSettings();
      applyStaticText();
      if(state.mode === 'special') renderSpecialTab();
      else if(state.mode === 'vote') renderParticipant();
      else if(state.mode === 'admin' && state.adminSubTab === 'text') renderTextEditor();
    })
    .subscribe();
  sb.channel('members-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, async () => {
      await loadMembers();
      render();
    })
    .subscribe();
}
function handleRealtimeChange(){
  if(state.mode === 'daily') renderDailyContent(state.publicDate);
  else if(state.mode === 'cumulative') renderPublicCumulative();
  else if(state.mode === 'admin' && state.adminAuthed){
    if(state.adminSubTab === 'nonvoters') renderNonVotersContent();
    else if(state.adminSubTab === 'sheet') renderAttendanceSheetContent();
  }
  else if(state.mode === 'vote' && state.date && state.step < 5){
    getDateRecord(state.date).then(rec => { state.dateRecord = rec; render(); });
  }
}

/* ================= 상단 알림: 새 추가일정 안내 ================= */
async function checkSpecialAlert(){
  const events = await loadSpecialEvents();
  const now = new Date();
  const upcoming = events.filter(ev => ev.notify_active && new Date(ev.event_time) >= now)
                          .sort((a,b) => new Date(a.event_time) - new Date(b.event_time));
  const alertBox = document.getElementById('specialAlert');
  const alertText = document.getElementById('specialAlertText');
  if(upcoming.length){
    const ev = upcoming[0];
    const d = new Date(ev.event_time);
    const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일 (${weekdayOf(d)}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    alertText.textContent = `${ev.content} · ${dateStr} 추가일정 투표가 열렸어요!`;
    alertBox.dataset.eventId = ev.id;
    alertBox.style.display = 'flex';
  }else{
    alertBox.style.display = 'none';
  }
}
function goToSpecialFromAlert(){
  const alertBox = document.getElementById('specialAlert');
  const eventId = alertBox.dataset.eventId;
  state.specialFlow = { eventId: eventId ? Number(eventId) : null, dept: null, name: null, status: null, note: '', step: eventId ? 2 : 1 };
  setMode('special');
}
async function toggleEventNotify(eventId, newValue){
  try{
    const { error } = await sb.from('special_events').update({ notify_active: newValue }).eq('id', eventId);
    if(error) throw error;
  }catch(e){ console.error('안내판 상태 변경 실패', e); }
  checkSpecialAlert();
  renderSpecialTab();
}

function renderDateGrid(){
  const groups = {};
  SEASON_DATES.forEach(d => {
    const mk = monthKeyOf(d);
    (groups[mk] = groups[mk] || []).push(d);
  });
  const monthKeys = Object.keys(groups);
  if(!state.pickerMonth || !groups[state.pickerMonth]){
    const nextD = SEASON_DATES.find(d => isoOf(d) === findNextThursdayISO()) || SEASON_DATES[0];
    state.pickerMonth = monthKeyOf(nextD);
  }
  const nextISO = findNextThursdayISO();
  const dates = groups[state.pickerMonth];
  return `
    <select class="form-select" id="monthSelect">
      ${monthKeys.map(mk => `<option value="${mk}" ${mk===state.pickerMonth?'selected':''}>${mk}</option>`).join('')}
    </select>
    <div class="date-grid" style="margin-top:12px;">
      ${dates.map(d => {
        const iso = isoOf(d);
        const isNext = iso === nextISO;
        return `<button class="date-chip ${state.date===iso?'selected':''} ${isNext?'next-badge':''}" onclick="selectDate('${iso}')">
          <div class="d-month">${d.getMonth()+1}월</div>
          <div class="d-day">${d.getDate()}</div>
        </button>`;
      }).join('')}
    </div>
  `;
}

/* ================= 출석부 (훈련 날짜별 개인 출석표, 읽기 전용) ================= */
function lastPastThursdayISO(){
  const past = SEASON_DATES.filter(d => d < TODAY);
  return past.length ? isoOf(past[past.length-1]) : isoOf(SEASON_DATES[0]);
}
function renderAttendanceSheet(){
  if(!state.sheetStart) state.sheetStart = '2026-08-27';
  if(!state.sheetEnd) state.sheetEnd = lastPastThursdayISO();
  const body = document.getElementById('adminBody');
  const opts = sel => SEASON_DATES.map(d => `<option value="${isoOf(d)}" ${isoOf(d)===sel?'selected':''}>${fullDateLabel(d)}</option>`).join('');
  body.innerHTML = `<div class="card">

    <p class="muted">훈련 날짜별 회원 출석 현황이에요. 회원은 가나다 순으로 정렬돼요.</p>

    <label class="muted">종료일</label>
    <select class="date-select" id="sheetEndSel" style="margin-top:0;">${opts(state.sheetEnd)}</select>
    <div id="sheetContent"><div class="spinner-row">불러오는 중...</div></div>
  </div>`;
  document.getElementById('sheetStartSel').addEventListener('change', e => { state.sheetStart = e.target.value; renderAttendanceSheetContent(); });
  document.getElementById('sheetEndSel').addEventListener('change', e => { state.sheetEnd = e.target.value; renderAttendanceSheetContent(); });
  renderAttendanceSheetContent();
}
async function renderAttendanceSheetContent(){
  const cont = document.getElementById('sheetContent');
  if(!cont) return;
  const dates = SEASON_DATES.filter(d => isoOf(d) >= state.sheetStart && isoOf(d) <= state.sheetEnd);
  if(!dates.length){ cont.innerHTML = `<p class="muted" style="margin-top:12px;">선택한 기간에 훈련 날짜가 없어요. 시작일과 종료일을 확인해주세요.</p>`; return; }
  const all = await getAllSeasonRecords();
  const members = ALL_MEMBERS.slice().sort((a,b) => a.localeCompare(b, 'ko'));
  const totals = dates.map(() => 0);
  const rows = members.map(n => {
    let present = 0;
    const cells = dates.map((d, i) => {
      const r = (all[isoOf(d)] || {})[n];
      if(r && r.status === '참석'){ present++; totals[i]++; return `<td class="c-present">✓</td>`; }
      if(r && r.status === '불참') return `<td class="c-absent">✕</td>`;
      return `<td class="c-none">·</td>`;
    }).join('');
    const rate = Math.round((present / dates.length) * 100);
    return `<tr><td class="sticky-col">${n}</td>${cells}<td>${present}/${dates.length}</td><td class="rate">${rate}%</td></tr>`;
  }).join('');
  const head = dates.map(d => `<th>${d.getMonth()+1}/${d.getDate()}</th>`).join('');
  const foot = totals.map(t => `<td>${t}</td>`).join('');
  const totalPresent = totals.reduce((a,b)=>a+b,0);
  const avgRate = members.length ? Math.round((totalPresent / (members.length * dates.length)) * 100) : 0;
  cont.innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="num">${dates.length}</div><div class="lb">훈련 횟수</div></div>
      <div class="stat-box"><div class="num">${members.length}</div><div class="lb">회원 수</div></div>
      <div class="stat-box hl"><div class="num">${avgRate}%</div><div class="lb">전체 평균 출석률</div></div>
    </div>
    <div class="legend"><span>✓ 참석</span><span>✕ 불참</span><span>· 미응답</span><span>출석률 = 참석 ÷ 훈련 횟수</span></div>
    <div class="sheet-wrap">
      <table class="sheet-table">
        <thead><tr><th class="sticky-col">이름</th>${head}<th>참석</th><th>출석률</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td class="sticky-col">참석 인원</td>${foot}<td></td><td></td></tr></tfoot>
      </table>
    </div>`;
}

/* ================= 추가일정 (누적점수 미포함) ================= */
async function renderSpecialTab(){
  app.innerHTML = `<div class="spinner-row">불러오는 중...</div>`;

  if(state.specialFlow.eventId){ renderSpecialVoteFlow(); return; }
  if(state.pollFlow.pollId){ renderPollVoteFlow(); return; }

  const [events, allAtt, polls, allPollVotes] = await Promise.all([
    loadSpecialEvents(), loadAllSpecialAttendance(), loadSpecialPolls(), loadAllPollVotes()
  ]);
  state.specialEvents = events;
  state.specialPolls = polls;
  const now = new Date();

  const countsByEvent = {};
  const notesByEvent = {};
  allAtt.forEach(r => {
    if(!countsByEvent[r.event_id]) countsByEvent[r.event_id] = { present:0, absent:0 };
    if(r.status === '참석') countsByEvent[r.event_id].present++;
    else countsByEvent[r.event_id].absent++;
    if(r.note && r.note.trim()){
      (notesByEvent[r.event_id] = notesByEvent[r.event_id] || []).push({ name: r.member_name, note: r.note, status: r.status });
    }
  });

  let html = `<div class="card">
    <div class="section-title">${TEXT.special_tab_title}</div>
    <p class="muted" style="margin-top:-6px;">${TEXT.special_tab_desc}</p>
  </div>`;

  if(state.adminAuthed){
    html += `<div class="card">
      <div class="section-title">➕ 새 일정 등록</div>
      <label class="muted">일시</label>
      <input class="form-select" id="seDatetime" type="datetime-local">
      <label class="muted">장소</label>
      <input class="form-select" id="seLocation" type="text" placeholder="예: 월드컵공원 풋살구장">
      <label class="muted">내용</label>
      <input class="form-select" id="seContent" type="text" placeholder="예: 이웃 동호회와의 친선경기 / OO대회 / 정기 회식">
      <button class="submit-btn" id="seSubmitBtn" onclick="submitSpecialEvent()">등록하기</button>
    </div>`;
  }else{
    html += `<div class="notice-box">🛡️ 새 일정은 관리자만 등록할 수 있어요. 상단 오른쪽 <b>관리자</b> 버튼으로 로그인해주세요.</div>`;
  }

  html += `<div class="card"><div class="section-title" style="margin-bottom:0;">📅 등록된 일정</div>`;
  if(!events.length){
    html += `<p class="muted" style="margin-top:10px;">아직 등록된 일정이 없어요.</p>`;
  }else{
    const sorted = events.slice().sort((a,b) => new Date(a.event_time) - new Date(b.event_time));
    html += sorted.map(ev => {
      const d = new Date(ev.event_time);
      const isPast = d < now;
      const c = countsByEvent[ev.id] || { present:0, absent:0 };
      const none = ALL_MEMBERS.length - c.present - c.absent;
      return `<div class="card" style="margin-top:12px; ${isPast?'opacity:0.6;':''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>
            <div style="font-weight:800; color:var(--navy); font-size:14.5px;">${ev.content}</div>
            <div class="muted" style="margin-top:4px;">🗓️ ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${weekdayOf(d)}) ${pad(d.getHours())}:${pad(d.getMinutes())}</div>
            <div class="muted" style="margin-top:2px;">📍 ${ev.location}</div>
          </div>
          ${isPast ? '<span class="status-pill none">종료</span>' : ''}
        </div>
        <div class="stat-row" style="margin-top:12px;">
          <div class="stat-box hl"><div class="num">${c.present}</div><div class="lb">참석</div></div>
          <div class="stat-box"><div class="num">${c.absent}</div><div class="lb">불참</div></div>
          <div class="stat-box"><div class="num">${none}</div><div class="lb">미응답</div></div>
        </div>
        ${(notesByEvent[ev.id] && notesByEvent[ev.id].length) ? `
          <div style="margin-top:12px;">
            <div class="muted" style="font-weight:800; color:var(--navy);">💬 특이사항</div>
            <div style="margin-top:6px; display:flex; flex-direction:column; gap:6px;">
              ${notesByEvent[ev.id].map(n => `
                <div style="background:#fafbfd; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12.5px;">
                  <b style="color:var(--navy);">${n.name}</b>
                  <span class="status-pill ${n.status==='참석'?'present':'absent'}" style="margin-left:6px; padding:1px 8px; font-size:10px;">${n.status}</span>
                  <div class="muted" style="margin-top:3px;">${n.note}</div>
                </div>`).join('')}
            </div>
          </div>` : ''}
        <button class="submit-btn" style="margin-top:14px;" onclick="openSpecialVote(${ev.id})">투표하기</button>
        ${state.adminAuthed ? `<button class="again-btn" style="width:100%; margin-top:10px;" onclick="toggleEventNotify(${ev.id}, ${!ev.notify_active})">${ev.notify_active ? '🔕 안내판에서 내리기' : '🔔 안내판에 다시 올리기'}</button>` : ''}
      </div>`;
    }).join('');
  }
  html += `</div>`;

  if(state.adminAuthed){
    html += `<div class="card">
      <div class="section-title">🗳️ 새 투표 만들기</div>
      <p class="muted" style="margin-top:-6px;">출석 여부가 아닌, 식사 메뉴처럼 자유로운 항목에 대한 투표를 만들 수 있어요.</p>
      <label class="muted">질문</label>
      <input class="form-select" id="pollTitle" type="text" placeholder="예: 이번 회식 메뉴 뭐로 할까요?">
      <label class="muted">선택지 (한 줄에 하나씩)</label>
      <textarea class="form-select" id="pollOptions" rows="4" style="resize:vertical; font-family:inherit;" placeholder="삼겹살&#10;치킨&#10;족발&#10;회"></textarea>
      <button class="submit-btn" id="pollSubmitBtn" onclick="submitSpecialPoll()">투표 만들기</button>
    </div>`;
  }

  const pollCounts = {};
  allPollVotes.forEach(v => {
    if(!pollCounts[v.poll_id]) pollCounts[v.poll_id] = {};
    pollCounts[v.poll_id][v.option_choice] = (pollCounts[v.poll_id][v.option_choice] || 0) + 1;
  });

  html += `<div class="card"><div class="section-title" style="margin-bottom:0;">🗳️ 진행 중인 투표</div>`;
  if(!polls.length){
    html += `<p class="muted" style="margin-top:10px;">아직 등록된 투표가 없어요.</p>`;
  }else{
    html += polls.map(p => {
      const counts = pollCounts[p.id] || {};
      const totalVotes = Object.values(counts).reduce((a,b)=>a+b, 0);
      return `<div class="card" style="margin-top:12px;">
        <div style="font-weight:800; color:var(--navy); font-size:14.5px;">${p.title}</div>
        <div style="margin-top:10px; display:flex; flex-direction:column; gap:6px;">
          ${p.options.map(opt => {
            const cnt = counts[opt] || 0;
            const pct = totalVotes ? Math.round((cnt/totalVotes)*100) : 0;
            return `<div>
              <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--navy);">
                <span>${opt}</span><span class="muted">${cnt}표 (${pct}%)</span>
              </div>
              <div style="background:#eef0f5; border-radius:999px; height:8px; margin-top:3px; overflow:hidden;">
                <div style="background:var(--orange); height:100%; width:${pct}%;"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
        <button class="submit-btn" style="margin-top:14px;" onclick="openPollVote(${p.id})">투표하기</button>
      </div>`;
    }).join('');
  }
  html += `</div>`;

  app.innerHTML = html;
}

async function submitSpecialEvent(){
  const dt = document.getElementById('seDatetime').value;
  const loc = document.getElementById('seLocation').value.trim();
  const content = document.getElementById('seContent').value.trim();
  if(!dt || !loc || !content){ alert('일시, 장소, 내용을 모두 입력해주세요.'); return; }
  const btn = document.getElementById('seSubmitBtn');
  btn.disabled = true; btn.textContent = '등록 중...';
  const ok = await createSpecialEvent(new Date(dt).toISOString(), loc, content);
  if(ok){ checkSpecialAlert(); renderSpecialTab(); }
  else{ alert('등록에 실패했습니다. 다시 시도해주세요.'); btn.disabled = false; btn.textContent = '등록하기'; }
}

async function submitSpecialPoll(){
  const title = document.getElementById('pollTitle').value.trim();
  const options = document.getElementById('pollOptions').value.split('\n').map(s => s.trim()).filter(Boolean);

  const btn = document.getElementById('pollSubmitBtn');

async function renderPollVoteFlow(){
  app.innerHTML = `<div class="spinner-row">불러오는 중...</div>`;
  const polls = state.specialPolls.length ? state.specialPolls : await loadSpecialPolls();
  state.specialPolls = polls;
  const poll = polls.find(p => p.id === Number(state.pollFlow.pollId) || p.id === state.pollFlow.pollId);
  if(!poll){ backToSpecialList(); return; }
  const record = await getPollVotes(poll.id);
  state.pollFlow.record = record;

  let html = `<div class="card">
    <div class="breadcrumb" style="margin-top:0;"><span class="reset-link" onclick="backToSpecialList()">← 목록으로</span></div>
    <div style="margin-top:10px; font-weight:800; color:var(--navy); font-size:15px;">🗳️ ${poll.title}</div>
  </div>`;

  html += `<div class="card">
    <div class="section-title"><span class="step-num">1</span> 소속 부서를 선택하세요</div>
    <div class="dept-grid">
      ${DEPT_LIST.map(dep => `
        <button class="dept-btn ${state.pollFlow.dept===dep?'selected':''}" onclick="pollSelectDept('${dep}')">
          ${dep}<span class="cnt">${MEMBERS_BY_DEPT[dep].length}명</span>
        </button>`).join('')}
    </div>
  </div>`;

  if(state.pollFlow.dept){
    html += `<div class="card">
      <div class="section-title"><span class="step-num">2</span> 본인 이름을 선택하세요</div>
      <div class="name-grid">
        ${MEMBERS_BY_DEPT[state.pollFlow.dept].map(n => {
          const r = record[n];
          const badge = r ? `<span class="badge present">✓</span>` : '';
          return `<button class="name-btn ${state.pollFlow.name===n?'selected':''}" onclick="pollSelectName('${n}')">${n}${badge}</button>`;
        }).join('')}
      </div>
    </div>`;
  }

  if(state.pollFlow.name){
    const r = record[state.pollFlow.name];
    html += `<div class="card">
      <div class="section-title"><span class="step-num">3</span> 선택지를 고르세요</div>
      <div class="name-grid">
        ${poll.options.map(opt => `
          <button class="name-btn ${state.pollFlow.choice===opt?'selected':''}" onclick="pollSelectChoice('${opt.replace(/'/g,"\\'")}')" style="padding:14px 8px;">${opt}</button>
        `).join('')}
      </div>
      ${r ? `<p class="muted" style="margin-top:12px;">이미 <b>${r.choice}</b>로 등록되어 있어요. 다시 제출하면 내용이 수정됩니다.</p>` : ''}
      <button class="submit-btn" id="pollVoteSubmitBtn" ${state.pollFlow.choice ? '' : 'disabled'} onclick="submitPollVote()">제출하기</button>
    </div>`;
  }

  app.innerHTML = html;
}
function pollSelectDept(d){ state.pollFlow.dept = d; state.pollFlow.name=null; state.pollFlow.choice=null; renderPollVoteFlow(); }
function pollSelectName(n){
  state.pollFlow.name = n;
  const r = state.pollFlow.record[n];
  state.pollFlow.choice = r ? r.choice : null;
  renderPollVoteFlow();
}
function pollSelectChoice(c){ state.pollFlow.choice = c; renderPollVoteFlow(); }

async function submitPollVote(){
  const btn = document.getElementById('pollVoteSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = '제출 중...'; }
  const { pollId, dept, name, choice } = state.pollFlow;
  const ok = await savePollVote(pollId, name, dept, choice);
  if(ok){
    app.innerHTML = `<div class="card confirm-card">
      <span class="icon">🗳️</span>
      <h3>${name}님, '${choice}'에 투표했어요!</h3>
      <button class="again-btn" onclick="backToSpecialList()">목록으로 돌아가기</button>
    </div>`;
  }else{
    alert('제출에 실패했습니다. 다시 시도해주세요.');
    if(btn){ btn.disabled = false; btn.textContent = '제출하기'; }
  }
}

async function renderSpecialVoteFlow(){
  app.innerHTML = `<div class="spinner-row">불러오는 중...</div>`;
  const events = state.specialEvents.length ? state.specialEvents : await loadSpecialEvents();
  state.specialEvents = events;
  const ev = events.find(e => e.id === Number(state.specialFlow.eventId) || e.id === state.specialFlow.eventId);
  if(!ev){ backToSpecialList(); return; }
  const d = new Date(ev.event_time);
  const record = await getSpecialAttendance(ev.id);
  state.specialFlow.record = record;

  let html = `<div class="card">
    <div class="breadcrumb" style="margin-top:0;"><span class="reset-link" onclick="backToSpecialList()">← 일정 목록으로</span></div>
    <div style="margin-top:10px; font-weight:800; color:var(--navy); font-size:15px;">${ev.content}</div>
    <div class="muted" style="margin-top:4px;">🗓️ ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${weekdayOf(d)}) ${pad(d.getHours())}:${pad(d.getMinutes())} · 📍 ${ev.location}</div>
  </div>`;

  html += `<div class="card">
    <div class="section-title"><span class="step-num">1</span> 소속 부서를 선택하세요</div>
    <div class="dept-grid">
      ${DEPT_LIST.map(dep => `
        <button class="dept-btn ${state.specialFlow.dept===dep?'selected':''}" onclick="specialSelectDept('${dep}')">
          ${dep}<span class="cnt">${MEMBERS_BY_DEPT[dep].length}명</span>
        </button>`).join('')}
    </div>
  </div>`;

  if(state.specialFlow.dept){
    html += `<div class="card">
      <div class="section-title"><span class="step-num">2</span> 본인 이름을 선택하세요</div>
      <div class="name-grid">
        ${MEMBERS_BY_DEPT[state.specialFlow.dept].map(n => {
          const r = record[n];
          const badge = r ? `<span class="badge ${r.status==='참석'?'present':'absent'}">${r.status==='참석'?'✓':'✕'}</span>` : '';
          return `<button class="name-btn ${state.specialFlow.name===n?'selected':''}" onclick="specialSelectName('${n}')">${n}${badge}</button>`;
        }).join('')}
      </div>
    </div>`;
  }

  if(state.specialFlow.name){
    const r = record[state.specialFlow.name];
    html += `<div class="card">
      <div class="section-title"><span class="step-num">3</span> 참석 여부를 선택하세요</div>
      <div class="status-grid">
        <button class="status-btn present ${state.specialFlow.status==='참석'?'selected':''}" onclick="specialSelectStatus('참석')">
          <span class="emoji">⚽</span><span class="label">참석</span>
        </button>
        <button class="status-btn absent ${state.specialFlow.status==='불참'?'selected':''}" onclick="specialSelectStatus('불참')">
          <span class="emoji">🙅</span><span class="label">불참</span>
        </button>
      </div>
      <label class="muted">💬 특이사항 (선택사항 · 예: 30분 늦을 것 같아요)</label>
      <textarea class="form-select" id="specialNoteInput" rows="2" style="resize:vertical; font-family:inherit;" placeholder="팀원들에게 남길 특이사항을 적어주세요" oninput="state.specialFlow.note=this.value">${state.specialFlow.note || ''}</textarea>
      ${r ? `<p class="muted" style="margin-top:12px;">이미 <b>${r.status}</b>으로 등록되어 있어요. 다시 제출하면 내용이 수정됩니다.</p>` : ''}
      <button class="submit-btn" id="specialSubmitBtn" ${state.specialFlow.status ? '' : 'disabled'} onclick="submitSpecialAttendance()">제출하기</button>
      ${r ? `<button class="again-btn" id="specialCancelBtn" style="width:100%; margin-top:10px;" onclick="cancelSpecialAttendance()">↩️ 답변 취소하기 (미응답으로 되돌리기)</button>` : ''}
    </div>`;
  }

  app.innerHTML = html;
}

function specialSelectDept(d){ state.specialFlow.dept = d; state.specialFlow.name=null; state.specialFlow.status=null; state.specialFlow.note=''; renderSpecialVoteFlow(); }
function specialSelectName(n){
  state.specialFlow.name = n;
  const r = state.specialFlow.record[n];
  state.specialFlow.status = r ? r.status : null;
  state.specialFlow.note = r ? (r.note || '') : '';
  renderSpecialVoteFlow();
}
function specialSelectStatus(s){ state.specialFlow.status = s; renderSpecialVoteFlow(); }

async function submitSpecialAttendance(){
  const btn = document.getElementById('specialSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = '제출 중...'; }
  const { eventId, dept, name, status, note } = state.specialFlow;
  const ok = await saveSpecialAttendanceRow(eventId, name, dept, status, note);
  if(ok){
    app.innerHTML = `<div class="card confirm-card">
      <span class="icon">${status==='참석' ? '✅' : '📋'}</span>
      <h3>${name}님, ${status} 처리되었어요!</h3>
      <button class="again-btn" onclick="backToSpecialList()">일정 목록으로 돌아가기</button>
    </div>`;
  }else{
    alert('제출에 실패했습니다. 다시 시도해주세요.');
    if(btn){ btn.disabled = false; btn.textContent = '제출하기'; }
  }
}

async function cancelSpecialAttendance(){
  const { eventId, name } = state.specialFlow;
  if(!confirm(`${name}님의 투표를 취소하고 미응답 상태로 되돌릴까요?`)) return;
  const btn = document.getElementById('specialCancelBtn');
  if(btn){ btn.disabled = true; btn.textContent = '취소 중...'; }
  const ok = await deleteSpecialAttendanceRow(eventId, name);
  if(ok){
    state.specialFlow.record = await getSpecialAttendance(eventId);
    state.specialFlow.name = null; state.specialFlow.status = null; state.specialFlow.note = '';
    renderSpecialVoteFlow();
  }else{
    alert('취소에 실패했습니다. 다시 시도해주세요.');
    if(btn){ btn.disabled = false; btn.textContent = '↩️ 답변 취소하기 (미응답으로 되돌리기)'; }
  }
}

async function renderCumulativeInto(targetId){
  const body = document.getElementById(targetId);
  body.innerHTML = `<div class="card"><div class="spinner-row">전체 시즌 데이터를 불러오는 중...</div></div>`;

  const allRecords = await getAllSeasonRecords();
  const pastDates = SEASON_DATES.filter(d => d < TODAY);

  const stats = {};
  ALL_MEMBERS.forEach(n => stats[n] = { present:0, absent:0, none:0, score:0, dept: NAME_TO_DEPT[n] });

  SEASON_DATES.forEach(d => {
    const iso = isoOf(d);
    const rec = allRecords[iso] || {};
    const isPast = d < TODAY;
    ALL_MEMBERS.forEach(n => {
      const r = rec[n];
      if(r && r.status === '참석'){ stats[n].present++; stats[n].score += SCORE_PRESENT; }
      else if(r && r.status === '불참'){ stats[n].absent++; stats[n].score += SCORE_ABSENT_REPORTED; }
      else if(isPast){ stats[n].none++; stats[n].score += SCORE_NO_RESPONSE; }
    });
  });

  const ranked = ALL_MEMBERS.slice().sort((a,b)=> stats[b].score - stats[a].score);
  const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':'';

  const deptStats = {};
  DEPT_LIST.forEach(dept=>{
    const members = MEMBERS_BY_DEPT[dept];
    let totalScore=0, totalPresent=0, totalPossible=0;
    members.forEach(n=>{
      totalScore += stats[n].score;
      totalPresent += stats[n].present;
      totalPossible += (stats[n].present + stats[n].absent + stats[n].none);
    });
    deptStats[dept] = {
      totalScore,
      avgRate: totalPossible ? Math.round((totalPresent/totalPossible)*100) : 0,
      memberCount: members.length
    };
  });
  const deptRanked = DEPT_LIST.slice().sort((a,b)=> deptStats[b].avgRate - deptStats[a].avgRate);

  const topScorer = ranked[0];
  const nextTraining = SEASON_DATES.find(d => d >= TODAY);

  body.innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-bottom:0;">📊 시즌 요약</div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${ALL_MEMBERS.length}</div><div class="lb">전체 회원</div></div>
        <div class="stat-box"><div class="num">${SEASON_DATES.length}</div><div class="lb">시즌 총 훈련</div></div>
        <div class="stat-box"><div class="num">${pastDates.length}</div><div class="lb">진행된 훈련</div></div>
        <div class="stat-box hl"><div class="num">${nextTraining? nextTraining.getMonth()+1+'/'+nextTraining.getDate() : '-'}</div><div class="lb">다음 훈련</div></div>
      </div>
      <p class="muted" style="margin-top:14px;">🏆 현재 출석 1위: <b style="color:var(--navy)">${topScorer}</b> (${stats[topScorer].score}점, ${NAME_TO_DEPT[topScorer]})</p>
      <div class="legend">
        <span>⚽ 참석 +${SCORE_PRESENT}점</span>
        <span>❓ 미응답(지난 훈련) +${SCORE_NO_RESPONSE}점</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">🥅 부서 대항전 순위 (평균 출석률)</div>
      <table class="data-table">
        <thead><tr><th>순위</th><th>부서</th><th>인원</th><th>평균 출석률</th><th>부서 누적점수</th></tr></thead>
        <tbody>
          ${deptRanked.map((dept,i)=>`
            <tr>
              <td class="rank-badge rank-${i+1}">${medal(i)||(i+1)}</td>
              <td><span class="dept-tag">${dept}</span></td>
              <td>${deptStats[dept].memberCount}명</td>
              <td>${deptStats[dept].avgRate}%</td>
              <td>${deptStats[dept].totalScore}점</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="section-title">👤 개인별 누적 순위</div>
      <table class="data-table">
        <thead><tr><th>순위</th><th>이름</th><th>부서</th><th>참석</th><th>불참</th><th>미응답</th><th>점수</th></tr></thead>
        <tbody>
          ${ranked.map((n,i)=>`
            <tr>
              <td class="rank-badge rank-${i+1}">${medal(i)||(i+1)}</td>
              <td>${n}</td>
              <td><span class="dept-tag">${stats[n].dept}</span></td>
              <td>${stats[n].present}</td>
              <td>${stats[n].absent}</td>
              <td>${stats[n].none}</td>
              <td><b>${stats[n].score}</b></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

  await Promise.all([loadSettings(), loadMembers()]);
